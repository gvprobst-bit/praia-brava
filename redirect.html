<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Georgia', serif;
    }

    .card {
      text-align: center;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;
    }

    .icon svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.4;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }

    p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      font-family: sans-serif;
      margin-bottom: 36px;
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D4A854;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    .gold-line {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #D4A854, transparent);
      margin: 0 auto 28px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <!-- WhatsApp icon -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="24" fill="#25D366" fill-opacity="0.15"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M24 10C16.268 10 10 16.268 10 24C10 26.6 10.702 29.04 11.93 31.14L10 38L17.06 36.1C19.1 37.22 21.478 37.9 24 37.9C31.732 37.9 38 31.632 38 23.9C38 16.268 31.732 10 24 10ZM19.6 17.8C19.32 17.8 18.88 17.9 18.5 18.32C18.12 18.74 17 19.8 17 21.96C17 24.12 18.54 26.2 18.76 26.5C18.98 26.8 21.9 31.4 26.4 33.2C30.9 35 30.9 34.4 31.7 34.32C32.5 34.24 34.3 33.26 34.64 32.22C34.98 31.18 34.98 30.28 34.86 30.1C34.74 29.92 34.46 29.8 34.04 29.58C33.62 29.36 31.46 28.3 31.08 28.16C30.7 28.02 30.42 27.96 30.14 28.38C29.86 28.8 29.02 29.8 28.78 30.08C28.54 30.36 28.3 30.4 27.88 30.18C27.46 29.96 26.1 29.5 24.48 28.06C23.22 26.94 22.36 25.56 22.12 25.14C21.88 24.72 22.1 24.5 22.32 24.28C22.52 24.08 22.74 23.76 22.96 23.52C23.18 23.28 23.26 23.1 23.4 22.82C23.54 22.54 23.46 22.3 23.36 22.08C23.26 21.86 22.42 19.7 22.08 18.9C21.74 18.12 21.4 18.2 21.14 18.18C20.9 18.16 20.62 18.16 20.34 18.16C20.06 18.16 19.88 17.8 19.6 17.8Z" fill="#25D366"/>
      </svg>
    </div>

    <div class="gold-line"></div>

    <h1>Tudo certo!<br>Conectando você a um especialista.</h1>
    <p>Você será redirecionado para o WhatsApp em instantes.</p>

    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    const numero = "5548991131309";
    const mensagem = encodeURIComponent("Olá! Vi o anúncio dos studios na Praia Brava e quero saber mais.");
    const url = `https://wa.me/${numero}?text=${mensagem}`;

    setTimeout(() => {
      window.location.href = url;
    }, 1500);
  </script>

</body>
</html>
